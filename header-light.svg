<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Aman Singh, Product Data Scientist">
  <rect width="1200" height="280" fill="#FFFFFF"/>

  <!-- name + role -->
  <text x="60" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#1F2328">Aman Singh</text>
  <text x="63" y="172" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="2.6" fill="#656D76">PRODUCT DATA SCIENTIST</text>
  <text x="63" y="196" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="2.6" fill="#656D76">CAUSAL INFERENCE / EXPERIMENTATION / LLM SYSTEMS</text>

  <!-- forest plot -->
  <g stroke-width="2" stroke-linecap="round">
    <!-- zero line -->
    <line x1="800" y1="72" x2="800" y2="222" stroke="#D0D7DE" stroke-width="1.5" stroke-dasharray="4 5"/>

    <!-- row 1: significant -->
    <line x1="822" y1="92" x2="1002" y2="92" stroke="#1F8F7D"/>
    <line x1="822" y1="85" x2="822" y2="99" stroke="#1F8F7D"/>
    <line x1="1002" y1="85" x2="1002" y2="99" stroke="#1F8F7D"/>
    <circle cx="912" cy="92" r="5" fill="#1F8F7D"/>

    <!-- row 2: significant -->
    <line x1="862" y1="132" x2="1092" y2="132" stroke="#1F8F7D"/>
    <line x1="862" y1="125" x2="862" y2="139" stroke="#1F8F7D"/>
    <line x1="1092" y1="125" x2="1092" y2="139" stroke="#1F8F7D"/>
    <circle cx="977" cy="132" r="5" fill="#1F8F7D"/>

    <!-- row 3: crosses zero -->
    <line x1="768" y1="172" x2="898" y2="172" stroke="#AFB8C1"/>
    <line x1="768" y1="165" x2="768" y2="179" stroke="#AFB8C1"/>
    <line x1="898" y1="165" x2="898" y2="179" stroke="#AFB8C1"/>
    <circle cx="833" cy="172" r="5" fill="#AFB8C1"/>

    <!-- row 4: significant -->
    <line x1="846" y1="212" x2="1012" y2="212" stroke="#1F8F7D"/>
    <line x1="846" y1="205" x2="846" y2="219" stroke="#1F8F7D"/>
    <line x1="1012" y1="205" x2="1012" y2="219" stroke="#1F8F7D"/>
    <circle cx="929" cy="212" r="5" fill="#1F8F7D"/>
  </g>

  <text x="800" y="62" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8C959F">0</text>
  <text x="768" y="248" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#8C959F">effect size, 95% CI</text>
